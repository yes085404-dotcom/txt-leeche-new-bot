services:
  - type: web
    name: course-txt-uploader-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_PASSWORD
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DEFAULT_CREDIT
        value: Extract by Mr.Sanskari
